<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">{{ titulo }}</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            
                            <!-- Renderizado de campos del formulario con las clases de Bootstrap -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre del Servicio</label>
                                {{ form.nombre_servicio }}
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Cliente</label>
                                {{ form.cliente }}
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Precio ($)</label>
                                {{ form.precio }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Descuento ($)</label>
                                {{ form.descuento }}
                            </div>

                            <!-- Botones de control -->
                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'listar_servicios' %}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
