<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Servicio</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-danger shadow">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">¿Confirmar Eliminación?</h5>
                    </div>
                    <div class="card-body text-center p-4">
                        <p class="fs-5">¿Estás seguro de que deseas eliminar el servicio:</p>
                        <p class="fw-bold text-danger fs-4">"{{ servicio.nombre_servicio }}"</p>
                        <p class="text-muted">Asociado al cliente: {{ servicio.cliente }}</p>
                        
                        <form method="post" class="mt-4">
                            {% csrf_token %}
                            <a href="{% url 'listar_servicios' %}" class="btn btn-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
